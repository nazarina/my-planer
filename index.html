<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заботливый Планер | Кот и Код</title>
  <style>
    :root {
      --soft-pink: #fff0f3;
      --soft-purple: #f3f0ff;
      --accent-color: #008080;
      --deep-accent: #800000;
      --text-main: #4a4a4a;
      --white: #ffffff;
      --button-grad: linear-gradient(to top, #800000 0%, #d63031 100%);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--soft-pink);
      color: var(--text-main);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 650px;
      background-color: var(--white);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      padding: 25px;
      position: relative;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--soft-purple);
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .brand-title {
      font-size: 1.4rem;
      color: var(--deep-accent);
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sync-badge {
      font-size: 0.8rem;
      background-color: var(--soft-purple);
      color: var(--accent-color);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .sync-dot {
      width: 8px;
      height: 8px;
      background-color: #2e7d32;
      border-radius: 50%;
      display: inline-block;
    }

    .cat-card {
      background-color: var(--soft-purple);
      border-radius: 16px;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .cat-avatar {
      font-size: 2.5rem;
      background: var(--white);
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .cat-speech {
      font-size: 0.95rem;
      color: var(--text-main);
      line-height: 1.4;
    }

    .task-input-section {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid var(--soft-purple);
      border-radius: 12px;
      outline: none;
      font-size: 1rem;
      color: var(--text-main);
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    .btn-add {
      background: var(--button-grad);
      color: var(--white);
      border: none;
      border-radius: 12px;
      padding: 0 20px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn-add:hover {
      opacity: 0.9;
    }

    .task-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background-color: #fafafa;
      border-radius: 12px;
      border-left: 4px solid var(--accent-color);
      transition: all 0.2s;
    }

    .task-item.completed {
      border-left-color: #a0a0a0;
      opacity: 0.6;
    }

    .task-item.completed .task-text {
      text-decoration: line-through;
    }

    .task-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .task-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    .task-text {
      font-size: 1rem;
    }

    .btn-delete {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
    }

    .btn-delete:hover {
      background-color: #fceae8;
    }

    .empty-state {
      text-align: center;
      padding: 30px;
      color: #888;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand-title">
        🐾 Кот и Код
      </div>
      <div class="sync-badge">
        <span class="sync-dot"></span>
        Облачная синхронизация
      </div>
    </header>

    <div class="cat-card">
      <div class="cat-avatar">🐱</div>
      <div class="cat-speech" id="catSpeech">
        Привет! Я твой помощник. Все твои задачи синхронизируются мгновенно между всеми устройствами!
      </div>
    </div>

    <div class="task-input-section">
      <input type="text" id="taskInput" placeholder="Добавь новую задачу..." onkeydown="if(event.key==='Enter') addTask()">
      <button class="btn-add" onclick="addTask()">Добавить</button>
    </div>

    <ul class="task-list" id="taskList">
      <div class="empty-state">Загружаем твои задачи из облака...</div>
    </ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-app.js";
    import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/11.4.0/firebase-database.js";

    // Конфигурация Firebase из твоего проекта
    const firebaseConfig = {
      apiKey: "AIzaSyAW9W3M4p5yHxfwN4lhOot3YWxFoPKciEA",
      authDomain: "diary-1c00d.firebaseapp.com",
      databaseURL: "https://diary-1c00d-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "diary-1c00d",
      storageBucket: "diary-1c00d.firebasestorage.app",
      messagingSenderId: "576706054131",
      appId: "1:576706054131:web:c8a711d8d429a363dbb486"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const tasksRef = ref(db, 'planner/tasks');

    let currentTasks = [];

    // Слушатель событий в реальном времени (синхронизация со всеми устройствами)
    onValue(tasksRef, (snapshot) => {
      const data = snapshot.val();
      currentTasks = data || [];
      renderTasks(currentTasks);
      updateCatSpeech();
    });

    function saveTasksToCloud() {
      set(tasksRef, currentTasks);
    }

    function renderTasks(tasks) {
      const listEl = document.getElementById('taskList');
      listEl.innerHTML = '';

      if (tasks.length === 0) {
        listEl.innerHTML = '<div class="empty-state">У тебя пока нет задач. Отличный повод отдыхать! 🐱</div>';
        return;
      }

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = `task-item ${task.completed ? 'completed' : ''}`;
        li.innerHTML = `
          <div class="task-left">
            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
            <span class="task-text">${escapeHtml(task.text)}</span>
          </div>
          <button class="btn-delete" onclick="deleteTask(${index})" title="Удалить">🗑️</button>
        `;
        listEl.appendChild(li);
      });
    }

    function updateCatSpeech() {
      const speech = document.getElementById('catSpeech');
      const total = currentTasks.length;
      const completed = currentTasks.filter(t => t.completed).length;

      if (total === 0) {
        speech.textContent = "Мурр! Все дела сделаны, можно отдохнуть!";
      } else if (completed === total) {
        speech.textContent = "Ура! Все задачи выполнены! Ты супер!";
      } else {
        speech.textContent = `Выполнено ${completed} из ${total} задач. Мур-с, двигаемся дальше!`;
      }
    }

    window.addTask = function() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;

      currentTasks.push({
        text: text,
        completed: false,
        createdAt: Date.now()
      });

      input.value = '';
      saveTasksToCloud();
    };

    window.toggleTask = function(index) {
      if (currentTasks[index]) {
        currentTasks[index].completed = !currentTasks[index].completed;
        saveTasksToCloud();
      }
    };

    window.deleteTask = function(index) {
      if (currentTasks[index]) {
        currentTasks.splice(index, 1);
        saveTasksToCloud();
      }
    };

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, function(m) {
        return {
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#039;'
        }[m];
      });
    }
  </script>
</body>
</html>
